corpus:
  chunks: corpus/chunks.jsonl
  probes: corpus/probes.jsonl
  index_dir: index/

retrieval:
  embedder: BAAI/bge-m3
  top_k: 12            # future anchor count (ENG 01 §2b)

generator:
  model: microsoft/phi-4               # 14B, ~9 GB at 4-bit, 16K context
  compare_model: meta-llama/Llama-3.2-3B-Instruct  # small-model comparison (Stage 1c); gated on HF, accept the license first
  load_in_4bit: true
  max_new_tokens: 400
  log_attention: false  # off until attention.py reduces per step; raw prefill attentions won't fit in 12 GB

verifier:
  model: cross-encoder/nli-deberta-v3-base
  tau: 0.5             # entailment threshold (TBM)
  repair_citations: true  # re-cite failed claims against other retrieved chunks; the UI shows the correction
  granularity: claim   # claim: verify each citation group as written; sentence: verify each sentence on its own
  sentence_context: none  # sentence mode: none | film | previous | resolve (what stands in for a lost antecedent)

gate:
  phi: 0.5             # min verified fraction before failure state (TBM)
  failure_message: "The corpus does not support an answer to this question."

narrator:
  enabled: false       # off by default
  backend: local       # local = reuse the loaded Phi-4; api is not wired yet
  min_claims: 2
  contradict_tau: 0.5
